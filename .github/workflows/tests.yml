name: tests
on: # this workflow runs on prs and pushes to main
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # step 1: Checkout: copy the repository code at one commit
      - name: Checkout Code
        uses: actions/checkout@v7
      # step 2: setup Java/JDK
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven # cache downloaded Maven dependencies so later runs are faster.
      # step 3: run tests
      - name: Run tests
        run: ./mvnw -B test